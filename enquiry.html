 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enquiry - Ubuntu Bakes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Enquiry</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="about.html">About Us</a> |
      <a href="services.html">Products</a> |
      <a href="enquiry.html">Enquiry</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Send Us Your Enquiry</h2>
    <form>
      <label for="name">Your Name:</label><br>
      <input type="text" id="name" name="name"><br><br>

      <label for="email">Your Email:</label><br>
      <input type="email" id="email" name="email"><br><br>

      <label for="product">Product of Interest:</label><br>
      <select id="product" name="product">
        <option>Marula Fruit Rolls</option>
        <option>Amagwinya</option>
        <option>Heritage Seed Loaf</option>
        <option>Custom Order</option>
      </select><br><br>

      <label for="message">Your Message:</label><br>
      <textarea id="message" name="message" rows="4"></textarea><br><br>

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Ubuntu Bakes</p>
  </footer>
</body>
</html>
